[package]
name = "cofferdb"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "Single-file embedded retrieval database for explainable local RAG."
readme = "../README.md"
keywords = ["database", "retrieval", "bm25", "rag", "embedded"]
categories = ["database-implementations"]
repository = "https://github.com/maredengb/cofferdb"

[lib]
name = "cofferdb"
path = "src/lib.rs"

[[bin]]
name = "coffer"
path = "src/main.rs"
